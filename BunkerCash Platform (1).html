=== WALLET ================= -->\n  <sc-if value=\"{{isWallet}}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"Wallet\" style=\"flex:1;animation:fadeIn .3s ease both\">\n      <div class=\"bx-main\" style=\"max-width:1320px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-direction:column;gap:20px\">\n\n        <sc-if value=\"{{wbNotConnected}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:1px dashed var(--border-2);border-radius:14px;padding:72px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center\">\n            <span style=\"width:44px;height:44px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-2)\">\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><rect x=\"2\" y=\"5\" width=\"16\" height=\"11\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/rect><path d=\"M2 8h16\" stroke=\"currentColor\" stroke-width=\"1.4\"><\/path><circle cx=\"14.5\" cy=\"12\" r=\"1.1\" fill=\"currentColor\"><\/circle><\/svg>\n            <\/span>\n            <h1 style=\"margin:0;font-size:19px;font-weight:600\">Connect a wallet to view your portfolio<\/h1>\n            <p style=\"margin:0;font-size:13.5px;color:var(--text-2);max-width:400px;line-height:1.6\">Balances, escrow, settlement progress, and transaction history are read directly from Solana Devnet. BunkerCash never holds your keys.<\/p>\n            <button onclick=\"{{openConnect}}\" style=\"margin-top:6px;height:40px;padding:0 20px;border-radius:8px;background:var(--accent-btn);color:var(--accent-ink);font-weight:600;font-size:14px;transition:background .16s\" style-hover=\"background:var(--accent-btn-h)\">Connect wallet<\/button>\n          <\/div>\n        <\/sc-if>\n\n        <sc-if value=\"{{wbConnected}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:20px\">\n\n            <!-- Wallet summary -->\n            <section aria-label=\"Wallet summary\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <h1 style=\"margin:0;font-size:14px;font-weight:600;color:var(--text-2)\">Connected wallet<\/h1>\n                <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n                  <span style=\"width:7px;height:7px;border-radius:50%;background:var(--accent)\"><\/span>\n                  <span style=\"font-family:var(--mono);font-size:14.5px\">Hmod9xK2…L5uD4JhK<\/span>\n                  <button onclick=\"{{copyAddr}}\" aria-label=\"Copy wallet address\" title=\"Copy address\" style=\"width:26px;height:26px;border-radius:6px;border:1px solid var(--border);color:var(--text-3);display:flex;align-items:center;justify-content:center;transition:color .16s,border-color .16s\" style-hover=\"color:var(--text);border-color:var(--border-2)\">\n                    <svg width=\"12\" height=\"12\" viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><rect x=\"4.5\" y=\"4.5\" width=\"8\" height=\"8\" rx=\"1.5\" stroke=\"currentColor\" stroke-width=\"1.2\"><\/rect><path d=\"M9.5 4.5v-1a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1\" stroke=\"currentColor\" stroke-width=\"1.2\"><\/path><\/svg>\n                  <\/button>\n                  <button onclick=\"{{openExplorer}}\" aria-label=\"View on explorer\" title=\"View on explorer\" style=\"width:26px;height:26px;border-radius:6px;border:1px solid var(--border);color:var(--text-3);display:flex;align-items:center;justify-content:center;transition:color .16s,border-color .16s\" style-hover=\"color:var(--text);border-color:var(--border-2)\">\n                    <svg width=\"12\" height=\"12\" viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6 3H4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2V8\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\"><\/path><path d=\"M8.5 2h3.5v3.5M11.8 2.2 6.8 7.2\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n                  <\/button>\n                <\/div>\n                <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3)\">Phantom · <span style=\"display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2)\">Solana Devnet<\/span><\/span>\n              <\/div>\n              <div class=\"exposure-col\" style=\"display:flex;flex-direction:column;gap:6px;align-items:flex-end;text-align:right\">\n                <span style=\"font-size:12.5px;color:var(--text-3)\">Total account exposure<\/span>\n                <span class=\"exposure-val\" style=\"font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums\">{{exposureFmt}}<\/span>\n                <span style=\"font-size:12px;color:var(--text-3)\">Wallet balances + escrow + pending settlements, at the current reference rate<\/span>\n              <\/div>\n            <\/section>\n\n            <!-- Balance metrics -->\n            <section aria-label=\"Balances\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden\">\n              <div class=\"metric-grid\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))\">\n                <sc-for list=\"{{walletMetrics}}\" as=\"m\" hint-placeholder-count=\"5\">\n                  <div class=\"metric-cell\" style=\"padding:16px 18px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);margin:0 -1px -1px 0;display:flex;flex-direction:column;gap:6px\">\n                    <span style=\"font-size:12.5px;color:var(--text-2)\">{{m.label}}<\/span>\n                    <span style=\"font-family:var(--mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em\">{{m.value}} <span style=\"font-size:12px;color:var(--text-3);font-weight:400\">{{m.unit}}<\/span><\/span>\n                    <span style=\"font-size:12px;color:var(--text-3)\">{{m.sub}}<\/span>\n                  <\/div>\n                <\/sc-for>\n              <\/div>\n            <\/section>\n\n            <!-- Transactions -->\n            <section aria-label=\"Transactions\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap\">\n                <span style=\"font-size:14px;font-weight:600\">Transactions<\/span>\n                <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                  <div role=\"tablist\" aria-label=\"Filter by type\" style=\"display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:2px\">\n                    <sc-for list=\"{{typeFilterItems}}\" as=\"f\" hint-placeholder-count=\"3\">\n                      <button onclick=\"{{f.on}}\" role=\"tab\" aria-selected=\"{{f.sel}}\" style=\"height:26px;padding:0 11px;border-radius:6px;font-size:12.5px;font-weight:600;transition:background .16s,color .16s;color:{{f.color}};background:{{f.bg}}\">{{f.label}}<\/button>\n                    <\/sc-for>\n                  <\/div>\n                  <span style=\"position:relative;display:inline-flex;align-items:center\">\n                    <select value=\"{{statusFilter}}\" onchange=\"{{onStatusFilter}}\" aria-label=\"Filter by status\" style=\"height:30px;padding:0 26px 0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);font-size:12.5px;font-weight:500;color:var(--text-2)\">\n                      <option value=\"all\">All statuses<\/option>\n                      <option value=\"Confirmed\">Confirmed<\/option>\n                      <option value=\"Submitted\">Submitted<\/option>\n                      <option value=\"Pending settlement\">Pending settlement<\/option>\n                      <option value=\"Partially settled\">Partially settled<\/option>\n                      <option value=\"Settled\">Settled<\/option>\n                      <option value=\"Cancelled\">Cancelled<\/option>\n                      <option value=\"Failed\">Failed<\/option>\n                    <\/select>\n                    <svg width=\"10\" height=\"10\" viewBox=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\" style=\"position:absolute;right:9px;pointer-events:none;color:var(--text-3)\"><path d=\"m2.5 4.5 3.5 3.5L9.5 4.5\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n                  <\/span>\n                <\/div>\n              <\/div>\n\n              <sc-if value=\"{{txEmpty}}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:56px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center\">\n                  <span style=\"font-size:14px;font-weight:600\">No matching transactions<\/span>\n                  <span style=\"font-size:13px;color:var(--text-3)\">Try a different type or status filter.<\/span>\n                  <button onclick=\"{{clearFilters}}\" style=\"margin-top:4px;height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface-2);font-weight:600;font-size:12.5px;transition:border-color .16s\" style-hover=\"border-color:var(--accent-line)\">Clear filters<\/button>\n                <\/div>\n              <\/sc-if>\n\n              <sc-if value=\"{{txHasRows}}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"tx-scroll\" style=\"overflow-x:auto\">\n                  <div class=\"tx-inner\" style=\"min-width:860px\">\n                    <div class=\"tx-head\" style=\"display:grid;grid-template-columns:110px 1.2fr 1fr 170px 150px 130px 96px;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border);font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text-3)\">\n                      <span>Type<\/span><span>Amount<\/span><span>Value<\/span><span>Status<\/span><span>Date<\/span><span>Signature<\/span><span style=\"text-align:right\">Actions<\/span>\n                    <\/div>\n                    <sc-for list=\"{{txRows}}\" as=\"t\" hint-placeholder-count=\"6\">\n                      <div class=\"tx-row\" style=\"display:grid;grid-template-columns:110px 1.2fr 1fr 170px 150px 130px 96px;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border);align-items:center;transition:background .14s\" style-hover=\"background:var(--surface-2)\">\n                        <span style=\"display:inline-flex;align-items:center;gap:8px\">\n                          <span style=\"width:7px;height:7px;border-radius:2px;flex:none;background:{{t.dotColor}}\"><\/span>\n                          <span style=\"font-size:13px;font-weight:500\">{{t.type}}<\/span>\n                        <\/span>\n                        <span style=\"display:flex;flex-direction:column;gap:1px;min-width:0\">\n                          <span style=\"font-family:var(--mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;color:{{t.amtColor}}\">{{t.amt}}<\/span>\n                          <span style=\"font-size:11.5px;color:var(--text-3)\">{{t.sub}}<\/span>\n                        <\/span>\n                        <span style=\"font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text-2)\">{{t.value}}<\/span>\n                        <span><span style=\"display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:500;color:{{t.stColor}};background:{{t.stBg}}\"><span style=\"width:5px;height:5px;border-radius:50%;background:currentColor\"><\/span>{{t.status}}<\/span><\/span>\n                        <span style=\"font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums\">{{t.date}}<\/span>\n                        <button onclick=\"{{t.copySig}}\" title=\"Copy transaction signature\" style=\"font-family:var(--mono);font-size:12px;color:var(--text-3);transition:color .14s;border-radius:4px\" style-hover=\"color:var(--accent)\">{{t.sig}}<\/button>\n                        <span style=\"display:flex;justify-content:flex-end;gap:6px\">\n                          <sc-if value=\"{{t.canCancel}}\" hint-placeholder-val=\"{{ false }}\">\n                            <button onclick=\"{{t.cancel}}\" style=\"height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--sell-line);color:var(--sell);font-size:12px;font-weight:600;transition:background .14s\" style-hover=\"background:var(--sell-soft)\">Cancel<\/button>\n                          <\/sc-if>\n                          <sc-if value=\"{{t.canRetry}}\" hint-placeholder-val=\"{{ false }}\">\n                            <button onclick=\"{{t.retry}}\" style=\"height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border-2);color:var(--text-2);font-size:12px;font-weight:600;transition:border-color .14s,color .14s\" style-hover=\"border-color:var(--accent-line);color:var(--accent)\">Retry<\/button>\n                          <\/sc-if>\n                          <button onclick=\"{{openExplorer}}\" aria-label=\"View on explorer\" title=\"View on explorer\" style=\"width:26px;height:26px;border-radius:6px;border:1px solid var(--border);color:var(--text-3);display:flex;align-items:center;justify-content:center;flex:none;transition:color .14s,border-color .14s\" style-hover=\"color:var(--text);border-color:var(--border-2)\">\n                            <svg width=\"11\" height=\"11\" viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6 3H4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2V8\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\"><\/path><path d=\"M8.5 2h3.5v3.5M11.8 2.2 6.8 7.2\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n                          <\/button>\n                        <\/span>\n                      <\/div>\n                    <\/sc-for>\n                  <\/div>\n                <\/div>\n                <sc-if value=\"{{txHasMore}}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;justify-content:center;padding:12px\">\n                    <button onclick=\"{{loadMore}}\" style=\"height:32px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--text-2);transition:border-color .16s,color .16s\" style-hover=\"border-color:var(--border-2);color:var(--text)\">Load more ({{txRemaining}})<\/button>\n                  <\/div>\n                <\/sc-if>\n              <\/sc-if>\n            <\/section>\n          <\/div>\n        <\/sc-if>\n      <\/div>\n    <\/main>\n  <\/sc-if>\n\n  <!-- ================= POOL ================= -->\n  <sc-if value=\"{{isPool}}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"Pool\" style=\"flex:1;animation:fadeIn .3s ease both\">\n      <div class=\"bx-main\" style=\"max-width:1320px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-direction:column;gap:20px\">\n\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;gap:2px\">\n            <h1 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em\">Pool status<\/h1>\n            <span style=\"font-size:13px;color:var(--text-3)\">Read-only protocol state. All values are read from on-chain accounts and carry no guarantees of liquidity, settlement, or value.<\/span>\n          <\/div>\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n            <span style=\"font-size:12.5px;color:var(--text-3)\">Last refreshed <span style=\"font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--text-2)\">{{updatedFmt}}<\/span><\/span>\n            <button onclick=\"{{refreshPool}}\" style=\"height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface-2);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;transition:border-color .16s\" style-hover=\"border-color:var(--accent-line)\">\n              <svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"animation:{{refreshSpin}}\"><path d=\"M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v2.6h-2.6\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n              <span>Refresh<\/span>\n            <\/button>\n          <\/div>\n        <\/div>\n\n        <sc-if value=\"{{chartStale}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:11px 16px;border:1px solid var(--amber-line);background:var(--amber-soft);border-radius:10px\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"color:var(--amber);flex:none\"><path d=\"M8 2 1.5 13h13L8 2Z\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linejoin=\"round\"><\/path><path d=\"M8 6.5v3M8 11.4v.2\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\"><\/path><\/svg>\n            <span style=\"font-size:13px;color:var(--amber)\">Displaying the last successful read. Values may be outdated — refresh to retry the RPC connection.<\/span>\n          <\/div>\n        <\/sc-if>\n\n        <!-- Summary metrics -->\n        <section aria-label=\"Pool summary\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden\">\n          <div class=\"metric-grid\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))\">\n            <sc-for list=\"{{poolMetrics}}\" as=\"m\" hint-placeholder-count=\"8\">\n              <div class=\"metric-cell\" style=\"position:relative;padding:16px 18px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);margin:0 -1px -1px 0;display:flex;flex-direction:column;gap:6px\">\n                <span style=\"display:flex;align-items:center;gap:6px\">\n                  <span style=\"font-size:12.5px;color:var(--text-2)\">{{m.label}}<\/span>\n                  <button onclick=\"{{m.tipToggle}}\" onmouseenter=\"{{m.tipShow}}\" onmouseleave=\"{{m.tipHide}}\" aria-label=\"{{m.tipAria}}\" style=\"width:16px;height:16px;border-radius:50%;border:1px solid var(--border-2);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;flex:none\" style-hover=\"color:var(--text-2);border-color:var(--text-3)\">i<\/button>\n                <\/span>\n                <span style=\"font-family:var(--mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:{{m.color}}\">{{m.value}} <span style=\"font-size:12px;color:var(--text-3);font-weight:400\">{{m.unit}}<\/span><\/span>\n                <sc-if value=\"{{m.tipOpen}}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"position:absolute;left:14px;right:14px;top:44px;z-index:20;padding:9px 11px;border-radius:8px;background:var(--surface-3);border:1px solid var(--border-2);box-shadow:var(--shadow-pop);font-size:12.5px;line-height:1.5;color:var(--text-2);animation:rise .14s ease both\">{{m.tip}}<\/span>\n                <\/sc-if>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/section>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n          <!-- Treasury composition -->\n          <section aria-label=\"Treasury composition\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <span style=\"font-size:14px;font-weight:600\">Treasury composition<\/span>\n              <span style=\"font-size:12.5px;color:var(--text-3)\">Pool NAV $4,231,297 · USDC-denominated<\/span>\n            <\/div>\n            <div style=\"display:flex;height:10px;border-radius:4px;overflow:hidden;gap:2px\" role=\"img\" aria-label=\"Treasury composition: liquid 28.4 percent, deployed 70.3 percent, reserved 1.3 percent\">\n              <span style=\"width:28.4%;background:var(--accent);display:block\"><\/span>\n              <span style=\"width:70.3%;background:var(--border-2);display:block\"><\/span>\n              <span style=\"width:1.3%;background:var(--amber);display:block;min-width:4px\"><\/span>\n            <\/div>\n            <div style=\"display:flex;flex-direction:column\">\n              <sc-for list=\"{{compRows}}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border)\">\n                  <span style=\"display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)\"><span style=\"width:8px;height:8px;border-radius:2px;flex:none;background:{{c.color}}\"><\/span>{{c.label}}<\/span>\n                  <span style=\"display:inline-flex;align-items:baseline;gap:10px\">\n                    <span style=\"font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text)\">{{c.value}}<\/span>\n                    <span style=\"font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--text-3);width:44px;text-align:right\">{{c.pct}}<\/span>\n                  <\/span>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n            <span style=\"font-size:12px;color:var(--text-3);line-height:1.55\">Deployed assets are managed by the protocol treasury. Reserved funds cover operational obligations.<\/span>\n          <\/section>\n\n          <!-- Liquidity health -->\n          <section aria-label=\"Liquidity health\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <span style=\"font-size:14px;font-weight:600\">Liquidity health<\/span>\n              <span style=\"font-size:12.5px;color:var(--text-3)\">Capacity to settle open sell requests<\/span>\n            <\/div>\n            <div style=\"display:flex;align-items:baseline;gap:10px\">\n              <span style=\"font-family:var(--mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)\">22.7×<\/span>\n              <span style=\"font-size:13px;color:var(--text-2)\">coverage of pending claims<\/span>\n            <\/div>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;justify-content:space-between;font-size:12.5px\"><span style=\"color:var(--text-3)\">Liquid USDC<\/span><span style=\"font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--text-2)\">$1,203,556<\/span><\/div>\n              <div style=\"height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden\">\n                <div style=\"height:100%;width:100%;background:var(--accent);border-radius:4px\"><\/div>\n              <\/div>\n              <div style=\"display:flex;justify-content:space-between;font-size:12.5px\"><span style=\"color:var(--text-3)\">Pending claims<\/span><span style=\"font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--text-2)\">$52,996<\/span><\/div>\n              <div style=\"height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden\">\n                <div style=\"height:100%;width:4.4%;background:var(--amber);border-radius:4px;min-width:4px\"><\/div>\n              <\/div>\n            <\/div>\n            <span style=\"font-size:12px;color:var(--text-3);line-height:1.55\">At current liquidity, new sell requests are expected to settle immediately. Coverage below 1.0× would queue settlements until liquidity is replenished.<\/span>\n          <\/section>\n        <\/div>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n          <!-- Settlement queue -->\n          <section aria-label=\"Settlement queue\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)\">\n              <span style=\"font-size:14px;font-weight:600\">Pending settlement queue<\/span>\n              <span style=\"font-size:12.5px;color:var(--text-3)\">12 open · settles first-in, first-out<\/span>\n            <\/div>\n            <div class=\"q-head\" style=\"display:grid;grid-template-columns:86px 1fr 1fr 70px 92px;gap:10px;padding:9px 18px;border-bottom:1px solid var(--border);font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text-3)\">\n              <span>Request<\/span><span>Amount<\/span><span>Est. USDC<\/span><span>Age<\/span><span>Status<\/span>\n            <\/div>\n            <sc-for list=\"{{queueRows}}\" as=\"q\" hint-placeholder-count=\"5\">\n              <div class=\"q-row\" style=\"display:grid;grid-template-columns:86px 1fr 1fr 70px 92px;gap:10px;padding:11px 18px;border-bottom:1px solid var(--border);align-items:center\">\n                <span style=\"font-family:var(--mono);font-size:12px;color:var(--text-2)\">{{q.id}}<\/span>\n                <span style=\"font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums\">{{q.bnkr}}<\/span>\n                <span style=\"font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text-2)\">{{q.usdc}}<\/span>\n                <span style=\"font-size:12px;color:var(--text-3)\">{{q.age}}<\/span>\n                <span><span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:500;color:{{q.stColor}};background:{{q.stBg}}\">{{q.status}}<\/span><\/span>\n              <\/div>\n            <\/sc-for>\n            <span style=\"padding:11px 18px;font-size:12px;color:var(--text-3)\">Requester addresses are truncated for privacy. Your own requests appear in Wallet.<\/span>\n          <\/section>\n\n          <!-- Supply composition + protocol data -->\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <section aria-label=\"Supply composition\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px\">\n              <span style=\"font-size:14px;font-weight:600\">Supply composition<\/span>\n              <div style=\"display:flex;height:10px;border-radius:4px;overflow:hidden;gap:2px\" role=\"img\" aria-label=\"Supply: 98.8 percent circulating, 1.2 percent escrowed\">\n                <span style=\"width:98.8%;background:var(--accent);display:block\"><\/span>\n                <span style=\"width:1.2%;background:var(--sell);display:block;min-width:4px\"><\/span>\n              <\/div>\n              <div style=\"display:flex;flex-direction:column\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--border)\">\n                  <span style=\"display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)\"><span style=\"width:8px;height:8px;border-radius:2px;background:var(--accent)\"><\/span>Circulating<\/span>\n                  <span style=\"font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums\">3,902,331 BNKR<\/span>\n                <\/div>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--border)\">\n                  <span style=\"display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)\"><span style=\"width:8px;height:8px;border-radius:2px;background:var(--sell)\"><\/span>Escrowed for pending sells<\/span>\n                  <span style=\"font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums\">48,873 BNKR<\/span>\n                <\/div>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--border)\">\n                  <span style=\"font-size:13px;color:var(--text-2);padding-left:16px\">Total supply<\/span>\n                  <span style=\"font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text-2)\">3,951,204 BNKR<\/span>\n                <\/div>\n              <\/div>\n            <\/section>\n\n            <section aria-label=\"Protocol data source\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-size:14px;font-weight:600;padding-bottom:8px\">Protocol data source<\/span>\n              <sc-for list=\"{{protoRows}}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border)\">\n                  <span style=\"font-size:12.5px;color:var(--text-3);flex:none\">{{p.label}}<\/span>\n                  <span style=\"display:inline-flex;align-items:center;gap:8px;min-width:0\">\n                    <span style=\"font-family:var(--mono);font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{p.addr}}<\/span>\n                    <button onclick=\"{{p.copy}}\" aria-label=\"{{p.copyAria}}\" style=\"width:24px;height:24px;border-radius:6px;border:1px solid var(--border);color:var(--text-3);display:flex;align-items:center;justify-content:center;flex:none;transition:color .14s,border-color .14s\" style-hover=\"color:var(--text);border-color:var(--border-2)\">\n                      <svg width=\"11\" height=\"11\" viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><rect x=\"4.5\" y=\"4.5\" width=\"8\" height=\"8\" rx=\"1.5\" stroke=\"currentColor\" stroke-width=\"1.2\"><\/rect><path d=\"M9.5 4.5v-1a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1\" stroke=\"currentColor\" stroke-width=\"1.2\"><\/path><\/svg>\n                    <\/button>\n                    <button onclick=\"{{openExplorer}}\" aria-label=\"View on explorer\" style=\"width:24px;height:24px;border-radius:6px;border:1px solid var(--border);color:var(--text-3);display:flex;align-items:center;justify-content:center;flex:none;transition:color .14s,border-color .14s\" style-hover=\"color:var(--text);border-color:var(--border-2)\">\n                      <svg width=\"11\" height=\"11\" viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6 3H4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2V8\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\"><\/path><path d=\"M8.5 2h3.5v3.5M11.8 2.2 6.8 7.2\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n                    <\/button>\n                  <\/span>\n                <\/div>\n              <\/sc-for>\n              <span style=\"padding-top:8px;font-size:12px;color:var(--text-3);line-height:1.55\">Reads use the public Devnet RPC. If a read fails, the interface shows the last successful values and flags them as stale.<\/span>\n            <\/section>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/sc-if>\n\n  <!-- ================= LEARN ================= -->\n  <sc-if value=\"{{isLearn}}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"Learn\" style=\"flex:1;animation:fadeIn .3s ease both\">\n      <div class=\"bx-main\" style=\"max-width:1320px;margin:0 auto;padding:32px 24px 64px;display:flex;gap:40px;align-items:flex-start\">\n\n        <sc-if value=\"{{isDesktopWide}}\" hint-placeholder-val=\"{{ true }}\">\n          <nav aria-label=\"On this page\" style=\"position:sticky;top:132px;width:216px;flex:none;display:flex;flex-direction:column;gap:1px\">\n            <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text-3);padding:0 12px 8px\">On this page<\/span>\n            <sc-for list=\"{{tocItems}}\" as=\"t\" hint-placeholder-count=\"8\">\n              <button onclick=\"{{t.on}}\" style=\"padding:7px 12px;border-radius:7px;font-size:13px;text-align:left;transition:background .14s,color .14s;color:{{t.color}};background:{{t.bg}};font-weight:{{t.weight}}\" style-hover=\"color:var(--text);background:var(--surface-2)\">{{t.label}}<\/button>\n            <\/sc-for>\n          <\/nav>\n        <\/sc-if>\n\n        <div style=\"flex:1;min-width:0;max-width:720px;display:flex;flex-direction:column;gap:36px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <h1 style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em\">How BunkerCash works<\/h1>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.65\">A factual guide to buying and selling BNKR, how the reference rate is calculated, and the risks involved. Nothing here is financial, investment, legal, or tax advice.<\/p>\n          <\/div>\n\n          <section id=\"learn-what\" style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600\">1. What BunkerCash is<\/h2>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.7\">BunkerCash (BNKR) is a digital token on Solana. You buy it with USDC and sell it back for USDC. The price is set by the protocol from on-chain pool data — there is no order book and no third-party market maker.<\/p>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.7\">Holding BNKR is not ownership of a company, asset, or revenue stream. It is a community-based token whose value can rise, fall, or reach zero.<\/p>\n          <\/section>\n\n          <section id=\"learn-price\" style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600\">2. How the reference rate is calculated<\/h2>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.7\">The reference rate is expressed in USDC per BNKR and computed on-chain:<\/p>\n            <div style=\"padding:14px 16px;border:1px solid var(--border-2);background:var(--surface-2);border-radius:10px;font-family:var(--mono);font-size:13px;color:var(--text)\">reference rate = pool NAV ÷ circulating supply<\/div>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.7\">The rate moves when the pool's net asset value or the circulating supply changes — for example when tokens are minted on a buy, burned on a settled sell, or when the pool NAV is updated.<\/p>\n          <\/section>\n\n          <section id=\"learn-buy\" style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600\">3. Buying BNKR<\/h2>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.7\">Buys execute immediately at the reference rate. There is no protocol fee; you pay only the Solana network fee.<\/p>\n            <div style=\"display:flex;align-items:stretch;gap:6px;flex-wrap:wrap\" role=\"img\" aria-label=\"Buy lifecycle: USDC sent, then reference rate applied, then BNKR minted, then wallet updated\">\n              <sc-for list=\"{{buySteps}}\" as=\"st\" hint-placeholder-count=\"4\">\n                <span style=\"display:flex;align-items:center;gap:6px;min-width:0\">\n                  <span style=\"display:flex;flex-direction:column;gap:2px;padding:9px 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface-2)\">\n                    <span style=\"font-family:var(--mono);font-size:10.5px;color:var(--accent)\">{{st.n}}<\/span>\n                    <span style=\"font-size:12.5px;font-weight:500;white-space:nowrap\">{{st.label}}<\/span>\n                  <\/span>\n                  <sc-if value=\"{{st.arrow}}\" hint-placeholder-val=\"{{ true }}\">\n                    <svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"color:var(--text-3);flex:none\"><path d=\"M2.5 8h11M9.5 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n                  <\/sc-if>\n                <\/span>\n              <\/sc-for>\n            <\/div>\n          <\/section>\n\n          <section id=\"learn-sell\" style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600\">4. Selling BNKR<\/h2>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.7\">A sell files a settlement request. Your BNKR moves into escrow, and USDC is paid out from pool liquidity at the reference rate captured for the request.<\/p>\n            <div style=\"display:flex;align-items:stretch;gap:6px;flex-wrap:wrap\" role=\"img\" aria-label=\"Sell lifecycle: BNKR locked, request created, liquidity checked, USDC settled, BNKR burned\">\n              <sc-for list=\"{{sellSteps}}\" as=\"st\" hint-placeholder-count=\"5\">\n                <span style=\"display:flex;align-items:center;gap:6px;min-width:0\">\n                  <span style=\"display:flex;flex-direction:column;gap:2px;padding:9px 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface-2)\">\n                    <span style=\"font-family:var(--mono);font-size:10.5px;color:var(--sell)\">{{st.n}}<\/span>\n                    <span style=\"font-size:12.5px;font-weight:500;white-space:nowrap\">{{st.label}}<\/span>\n                  <\/span>\n                  <sc-if value=\"{{st.arrow}}\" hint-placeholder-val=\"{{ true }}\">\n                    <svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"color:var(--text-3);flex:none\"><path d=\"M2.5 8h11M9.5 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n                  <\/sc-if>\n                <\/span>\n              <\/sc-for>\n            <\/div>\n          <\/section>\n\n          <section id=\"learn-settlement\" style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600\">5. Settlement and escrow<\/h2>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.7\">If liquid USDC covers your request, settlement is effectively immediate. If not, the request stays open in a first-in, first-out queue and settles — fully or partially — as liquidity is replenished. Escrowed BNKR is excluded from circulating supply while the request is open.<\/p>\n          <\/section>\n\n          <section id=\"learn-cancel\" style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600\">6. Cancelling a sell request<\/h2>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.7\">Any unsettled portion of a request can be cancelled at no cost beyond the network fee.<\/p>\n            <div style=\"display:flex;align-items:stretch;gap:6px;flex-wrap:wrap\" role=\"img\" aria-label=\"Cancel lifecycle: request cancelled, BNKR returned, circulating supply updated\">\n              <sc-for list=\"{{cancelSteps}}\" as=\"st\" hint-placeholder-count=\"3\">\n                <span style=\"display:flex;align-items:center;gap:6px;min-width:0\">\n                  <span style=\"display:flex;flex-direction:column;gap:2px;padding:9px 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface-2)\">\n                    <span style=\"font-family:var(--mono);font-size:10.5px;color:var(--text-3)\">{{st.n}}<\/span>\n                    <span style=\"font-size:12.5px;font-weight:500;white-space:nowrap\">{{st.label}}<\/span>\n                  <\/span>\n                  <sc-if value=\"{{st.arrow}}\" hint-placeholder-val=\"{{ true }}\">\n                    <svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"color:var(--text-3);flex:none\"><path d=\"M2.5 8h11M9.5 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n                  <\/sc-if>\n                <\/span>\n              <\/sc-for>\n            <\/div>\n          <\/section>\n\n          <section id=\"learn-liquidity\" style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600\">7. Pool liquidity<\/h2>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.7\">The pool holds liquid USDC for settlements, deployed assets managed by the treasury, and a small operational reserve. The liquidity coverage ratio on the Pool page shows how many times over the liquid USDC covers pending claims.<\/p>\n          <\/section>\n\n          <section id=\"learn-supply\" style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600\">8. Token supply<\/h2>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.7\">Total supply counts every BNKR in existence, including escrowed tokens. Circulating supply excludes escrow. Buys mint new tokens; settled sells burn them — supply expands and contracts with demand rather than being fixed.<\/p>\n          <\/section>\n\n          <section id=\"learn-risks\" style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600\">9. Risks and limitations<\/h2>\n            <div style=\"border:1px solid var(--amber-line);background:var(--amber-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n              <p style=\"margin:0;font-size:13.5px;color:var(--text);line-height:1.65\"><strong style=\"font-weight:600\">No guaranteed liquidity or timing.<\/strong> Sell requests settle only from available pool liquidity. Conversion may be slow, partial, or unavailable.<\/p>\n              <p style=\"margin:0;font-size:13.5px;color:var(--text);line-height:1.65\"><strong style=\"font-weight:600\">Value can fall to zero.<\/strong> The reference rate can decrease substantially. Use only funds you can afford to lose.<\/p>\n              <p style=\"margin:0;font-size:13.5px;color:var(--text);line-height:1.65\"><strong style=\"font-weight:600\">No claims or entitlements.<\/strong> BNKR confers no deposit, equity interest, participation right, or claim against any person or entity.<\/p>\n              <p style=\"margin:0;font-size:13.5px;color:var(--text);line-height:1.65\"><strong style=\"font-weight:600\">Access can be restricted.<\/strong> Availability depends on jurisdiction and eligibility and may be limited or suspended at any time.<\/p>\n            <\/div>\n          <\/section>\n\n          <section id=\"learn-technical\" style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600\">10. Smart-contract and network risks<\/h2>\n            <p style=\"margin:0;font-size:14px;color:var(--text-2);line-height:1.7\">Smart contracts can contain bugs. The Solana network can experience outages or congestion that delay or block transactions. Devnet in particular may be reset, which would erase balances — devnet assets never carry real-world value.<\/p>\n          <\/section>\n\n          <section id=\"learn-faq\" style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600\">11. Frequently asked questions<\/h2>\n            <div style=\"display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden\">\n              <sc-for list=\"{{faqItems}}\" as=\"f\" hint-placeholder-count=\"5\">\n                <div style=\"border-bottom:1px solid var(--border)\">\n                  <button onclick=\"{{f.toggle}}\" aria-expanded=\"{{f.openAria}}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;transition:background .14s\" style-hover=\"background:var(--surface-2)\">\n                    <span style=\"font-size:13.5px;font-weight:500\">{{f.q}}<\/span>\n                    <svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\" style=\"color:var(--text-3);flex:none;transition:transform .18s;transform:{{f.chev}}\"><path d=\"m2.5 4.5 3.5 3.5L9.5 4.5\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n                  <\/button>\n                  <sc-if value=\"{{f.open}}\" hint-placeholder-val=\"{{ false }}\">\n                    <p style=\"margin:0;padding:0 16px 14px;font-size:13.5px;color:var(--text-2);line-height:1.65;animation:rise .16s ease both\">{{f.a}}<\/p>\n                  <\/sc-if>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n          <\/section>\n\n          <section id=\"learn-contracts\" style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--border);padding-top:24px\">\n            <h2 style=\"margin:0;font-size:16.5px;font-weight:600;padding-bottom:8px\">12. Contracts and explorer links<\/h2>\n            <sc-for list=\"{{protoRows}}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border)\">\n                <span style=\"font-size:12.5px;color:var(--text-3);flex:none\">{{p.label}}<\/span>\n                <span style=\"display:inline-flex;align-items:center;gap:8px;min-width:0\">\n                  <span style=\"font-family:var(--mono);font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{p.addr}}<\/span>\n                  <button onclick=\"{{p.copy}}\" aria-label=\"{{p.copyAria}}\" style=\"width:24px;height:24px;border-radius:6px;border:1px solid var(--border);color:var(--text-3);display:flex;align-items:center;justify-content:center;flex:none;transition:color .14s,border-color .14s\" style-hover=\"color:var(--text);border-color:var(--border-2)\">\n                    <svg width=\"11\" height=\"11\" viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><rect x=\"4.5\" y=\"4.5\" width=\"8\" height=\"8\" rx=\"1.5\" stroke=\"currentColor\" stroke-width=\"1.2\"><\/rect><path d=\"M9.5 4.5v-1a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1\" stroke=\"currentColor\" stroke-width=\"1.2\"><\/path><\/svg>\n                  <\/button>\n                  <button onclick=\"{{openExplorer}}\" aria-label=\"View on explorer\" style=\"width:24px;height:24px;border-radius:6px;border:1px solid var(--border);color:var(--text-3);display:flex;align-items:center;justify-content:center;flex:none;transition:color .14s,border-color .14s\" style-hover=\"color:var(--text);border-color:var(--border-2)\">\n                    <svg width=\"11\" height=\"11\" viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6 3H4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2V8\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\"><\/path><path d=\"M8.5 2h3.5v3.5M11.8 2.2 6.8 7.2\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n                  <\/button>\n                <\/span>\n              <\/div>\n            <\/sc-for>\n          <\/section>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/sc-if>\n\n  <!-- Footer -->\n  <footer style=\"border-top:1px solid var(--border);flex:none;background:var(--surface)\">\n    <div class=\"bx-wrap\" style=\"max-width:1320px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:{{footerPadB}}\">\n      <span style=\"font-size:12.5px;color:var(--text-3)\">BunkerCash — informational interface for the BunkerCash protocol on Solana Devnet.<\/span>\n      <span style=\"display:flex;gap:20px;font-size:12.5px\">\n        <a href=\"#\" onclick=\"{{noopLink}}\" style=\"color:var(--text-2)\">Terms<\/a>\n        <a href=\"#\" onclick=\"{{noopLink}}\" style=\"color:var(--text-2)\">Imprint<\/a>\n        <button onclick=\"{{goLearn}}\" style=\"color:var(--text-2);font-size:12.5px\" style-hover=\"color:var(--text)\">Documentation<\/button>\n      <\/span>\n    <\/div>\n  <\/footer>\n\n  <!-- Mobile bottom navigation -->\n  <sc-if value=\"{{isMobile}}\" hint-placeholder-val=\"{{ false }}\">\n    <nav aria-label=\"Mobile navigation\" style=\"position:fixed;left:0;right:0;bottom:0;z-index:65;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom))\">\n      <sc-for list=\"{{navItems}}\" as=\"n\" hint-placeholder-count=\"5\">\n        <button onclick=\"{{n.on}}\" aria-current=\"{{n.cur}}\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;border-radius:8px;transition:color .16s;color:{{n.mColor}}\">\n          <span style=\"width:16px;height:2.5px;border-radius:2px;background:var(--accent);transition:opacity .2s;opacity:{{n.barOp}}\"><\/span>\n          <span style=\"font-size:11px;font-weight:600\">{{n.label}}<\/span>\n        <\/button>\n      <\/sc-for>\n    <\/nav>\n  <\/sc-if>\n\n  <!-- Connect wallet modal -->\n  <sc-if value=\"{{connectOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{closeConnect}}\" style=\"position:fixed;inset:0;z-index:90;background:rgba(4,7,9,.6);display:flex;justify-content:center;padding:20px;animation:fadeIn .18s ease both;align-items:{{sheetAlign}}\">\n      <div onclick=\"{{stopProp}}\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Connect a wallet\" style=\"width:{{sheetW}};max-width:420px;background:var(--surface-2);border:1px solid var(--border-2);box-shadow:var(--shadow-pop);padding:20px;display:flex;flex-direction:column;gap:16px;animation:sheetIn .22s cubic-bezier(.3,1,.4,1) both;border-radius:{{sheetRadius}};margin:{{sheetMargin}}\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <span style=\"font-size:16.5px;font-weight:600\">Connect a wallet<\/span>\n            <span style=\"font-size:12.5px;color:var(--text-3)\">Solana Devnet — no real funds are involved.<\/span>\n          <\/div>\n          <button onclick=\"{{closeConnect}}\" aria-label=\"Close dialog\" style=\"width:30px;height:30px;border-radius:7px;border:1px solid var(--border);color:var(--text-3);display:flex;align-items:center;justify-content:center;transition:color .16s,border-color .16s\" style-hover=\"color:var(--text);border-color:var(--border-2)\">\n            <svg width=\"11\" height=\"11\" viewBox=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"m2 2 8 8M10 2l-8 8\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\/path><\/svg>\n          <\/button>\n        <\/div>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{wallets}}\" as=\"w\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{w.pick}}\" style=\"display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);transition:border-color .16s\" style-hover=\"border-color:var(--border-2)\">\n              <span style=\"width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex:none;background:{{w.bg}}\">{{w.letter}}<\/span>\n              <span style=\"display:flex;flex-direction:column;flex:1;min-width:0\">\n                <span style=\"font-weight:600;font-size:13.5px\">{{w.name}}<\/span>\n                <span style=\"font-size:12px;color:{{w.subColor}}\">{{w.sub}}<\/span>\n              <\/span>\n              <sc-if value=\"{{w.spin}}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"width:15px;height:15px;border-radius:50%;border:2px solid var(--border-2);border-top-color:var(--accent);animation:spin .7s linear infinite;display:block;flex:none\"><\/span>\n              <\/sc-if>\n            <\/button>\n          <\/sc-for>\n        <\/div>\n        <span style=\"font-size:11.5px;color:var(--text-3);line-height:1.6;text-align:center\">By connecting you accept the <a href=\"#\" onclick=\"{{noopLink}}\">Terms<\/a>. BunkerCash never has custody of your keys or funds.<\/span>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n\n  <!-- Transaction review sheet -->\n  <sc-if value=\"{{sheetOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{sheetBackdrop}}\" style=\"position:fixed;inset:0;z-index:90;background:rgba(4,7,9,.6);display:flex;justify-content:center;padding:20px;animation:fadeIn .18s ease both;align-items:{{sheetAlign}}\">\n      <div onclick=\"{{stopProp}}\" role=\"dialog\" aria-modal=\"true\" aria-label=\"{{sheetTitle}}\" style=\"width:{{sheetW}};max-width:440px;background:var(--surface-2);border:1px solid var(--border-2);box-shadow:var(--shadow-pop);padding:20px;display:flex;flex-direction:column;gap:16px;animation:sheetIn .22s cubic-bezier(.3,1,.4,1) both;border-radius:{{sheetRadius}};margin:{{sheetMargin}}\">\n\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <span style=\"font-size:16.5px;font-weight:600\">{{sheetTitle}}<\/span>\n            <span style=\"font-size:12.5px;color:var(--text-3)\">{{sheetSub}}<\/span>\n          <\/div>\n          <sc-if value=\"{{sheetCanClose}}\" hint-placeholder-val=\"{{ true }}\">\n            <button onclick=\"{{closeSheet}}\" aria-label=\"Close dialog\" style=\"width:30px;height:30px;border-radius:7px;border:1px solid var(--border);color:var(--text-3);display:flex;align-items:center;justify-content:center;transition:color .16s,border-color .16s\" style-hover=\"color:var(--text);border-color:var(--border-2)\">\n              <svg width=\"11\" height=\"11\" viewBox=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"m2 2 8 8M10 2l-8 8\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\/path><\/svg>\n            <\/button>\n          <\/sc-if>\n        <\/div>\n\n        <sc-if value=\"{{phReview}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden\">\n            <sc-for list=\"{{sheetRows}}\" as=\"r\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);background:{{r.bg}}\">\n                <span style=\"font-size:13px;color:var(--text-3)\">{{r.k}}<\/span>\n                <span style=\"font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;font-weight:{{r.weight}};color:{{r.color}}\">{{r.v}}<\/span>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <sc-if value=\"{{isSell}}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:12.5px;color:var(--text-2);line-height:1.6;padding:0 2px\">Your BNKR moves to escrow when the request is created. {{expectSheetNote}}<\/span>\n          <\/sc-if>\n          <button onclick=\"{{confirmSheet}}\" style=\"height:46px;border-radius:10px;font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;transition:background .16s;background:{{sheetCtaBg}};color:{{sheetCtaColor}}\">{{sheetCta}}<\/button>\n          <span style=\"font-size:11.5px;color:var(--text-3);text-align:center\">You will be asked to approve this transaction in your wallet.<\/span>\n        <\/sc-if>\n\n        <sc-if value=\"{{phSigning}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 0 8px;text-align:center\">\n            <span style=\"width:40px;height:40px;border-radius:50%;border:3px solid var(--border-2);border-top-color:var(--accent);animation:spin .8s linear infinite;display:block\"><\/span>\n            <span style=\"font-size:14.5px;font-weight:600\">Confirm in your wallet<\/span>\n            <span style=\"font-size:13px;color:var(--text-2);max-width:300px;line-height:1.6\">Phantom is asking you to approve this transaction. Nothing is submitted until you sign.<\/span>\n          <\/div>\n          <button onclick=\"{{closeSheet}}\" style=\"height:38px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);font-weight:600;font-size:13px;color:var(--text-2);transition:border-color .16s\" style-hover=\"border-color:var(--red-line)\">Cancel<\/button>\n        <\/sc-if>\n\n        <sc-if value=\"{{phPending}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 0 8px;text-align:center\">\n            <span style=\"width:40px;height:40px;border-radius:50%;border:3px solid var(--border-2);border-top-color:var(--amber);animation:spin .8s linear infinite;display:block\"><\/span>\n            <span style=\"font-size:14.5px;font-weight:600\">Transaction submitted<\/span>\n            <span style=\"font-size:13px;color:var(--text-2);max-width:300px;line-height:1.6\">Waiting for confirmation on Solana Devnet. This usually takes a few seconds.<\/span>\n            <button onclick=\"{{copySig}}\" style=\"display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-family:var(--mono);font-size:12px;color:var(--text-2);transition:border-color .14s\" style-hover=\"border-color:var(--border-2)\">\n              <span>{{liveSig}}<\/span>\n              <svg width=\"11\" height=\"11\" viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><rect x=\"4.5\" y=\"4.5\" width=\"8\" height=\"8\" rx=\"1.5\" stroke=\"currentColor\" stroke-width=\"1.2\"><\/rect><path d=\"M9.5 4.5v-1a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1\" stroke=\"currentColor\" stroke-width=\"1.2\"><\/path><\/svg>\n            <\/button>\n          <\/div>\n        <\/sc-if>\n\n        <sc-if value=\"{{phSuccess}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0 4px;text-align:center\">\n            <span style=\"width:40px;height:40px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center\">\n              <svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\"><path d=\"m4 9.5 3.4 3.4L14 5.6\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>\n            <\/span>\n            <span style=\"font-size:14.5px;font-weight:600\">{{successTitle}}<\/span>\n            <span style=\"font-size:13px;color:var(--text-2);max-width:320px;line-height:1.6\">{{successSub}}<\/span>\n          <\/div>\n          <div style=\"display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden\">\n            <sc-for list=\"{{receiptRows}}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--border)\">\n                <span style=\"font-size:12.5px;color:var(--text-3)\">{{r.k}}<\/span>\n                <span style=\"font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;color:var(--text-2)\">{{r.v}}<\/span>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display:flex;gap:8px\">\n            <button onclick=\"{{openExplorer}}\" style=\"flex:1;height:40px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);font-weight:600;font-size:13px;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:7px;transition:border-color .16s\" style-hover=\"border-color:var(--border-2);color:var(--text)\">View on explorer<\/button>\n            <button onclick=\"{{doneSheet}}\" style=\"flex:1;height:40px;border-radius:8px;background:var(--accent-btn);color:var(--accent-ink);font-weight:600;font-size:13.5px;transition:background .16s\" style-hover=\"background:var(--accent-btn-h)\">Done<\/button>\n          <\/div>\n        <\/sc-if>\n\n        <sc-if value=\"{{phFailed}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0 4px;text-align:center\">\n            <span style=\"width:40px;height:40px;border-radius:50%;background:var(--red-soft);border:1px solid var(--red-line);display:flex;align-items:center;justify-content:center\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"m2 2 8 8M10 2l-8 8\" stroke=\"var(--red)\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\/path><\/svg>\n            <\/span>\n            <span style=\"font-size:14.5px;font-weight:600\">Transaction failed<\/span>\n            <span style=\"font-size:13px;color:var(--text-2);max-width:320px;line-height:1.6\">The transaction was not confirmed: insufficient SOL to cover the network fee. No funds moved.<\/span>\n          <\/div>\n          <div style=\"display:flex;gap:8px\">\n            <button onclick=\"{{closeSheet}}\" style=\"flex:1;height:40px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);font-weight:600;font-size:13px;color:var(--text-2);transition:border-color .16s\" style-hover=\"color:var(--text)\">Close<\/button>\n            <button onclick=\"{{retryTx}}\" style=\"flex:1;height:40px;border-radius:8px;background:var(--accent-btn);color:var(--accent-ink);font-weight:600;font-size:13.5px;transition:background .16s\" style-hover=\"background:var(--accent-btn-h)\">Try again<\/button>\n          <\/div>\n        <\/sc-if>\n\n      <\/div>\n    <\/div>\n  <\/sc-if>\n\n  <!-- Toasts -->\n  <div aria-live=\"polite\" style=\"position:fixed;top:140px;right:16px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(340px,calc(100vw - 32px))\">\n    <sc-for list=\"{{toasts}}\" as=\"t\" hint-placeholder-count=\"0\">\n      <div style=\"pointer-events:auto;display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-2);box-shadow:var(--shadow-pop);animation:toastIn .2s ease both\">\n        <span style=\"width:7px;height:7px;border-radius:50%;flex:none;margin-top:5px;background:{{t.dot}}\"><\/span>\n        <span style=\"font-size:13px;line-height:1.5;color:var(--text);flex:1\">{{t.msg}}<\/span>\n        <button onclick=\"{{t.close}}\" aria-label=\"Dismiss notification\" style=\"color:var(--text-3);flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:5px;transition:color .14s\" style-hover=\"color:var(--text)\">\n          <svg width=\"10\" height=\"10\" viewBox=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"m2 2 8 8M10 2l-8 8\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\/path><\/svg>\n        <\/button>\n      <\/div>\n    <\/sc-for>\n  <\/div>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;startRoute&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;trade&quot;, &quot;wallet&quot;, &quot;pool&quot;, &quot;learn&quot;], &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Preview state&quot;},\n  &quot;walletState&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;auto&quot;, &quot;disconnected&quot;, &quot;connecting&quot;, &quot;connected&quot;, &quot;wrong-network&quot;, &quot;error&quot;], &quot;default&quot;: &quot;auto&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Preview state&quot;},\n  &quot;dataState&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;live&quot;, &quot;loading&quot;, &quot;stale&quot;, &quot;error&quot;], &quot;default&quot;: &quot;live&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Preview state&quot;},\n  &quot;txOutcome&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;success&quot;, &quot;failure&quot;], &quot;default&quot;: &quot;success&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Preview state&quot;}\n}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const mk = (seed) => { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };\n    const gen = (n, endVal, totalDrift, vol, seed) => {\n      const rnd = mk(seed); const arr = new Array(n); arr[n - 1] = endVal;\n      const per = totalDrift / n;\n      for (let i = n - 1; i > 0; i--) arr[i - 1] = Math.max(0.4, arr[i] / (1 + (rnd() - 0.5) * vol + per));\n      return arr;\n    };\n    const R = 1.0843;\n    this.series = {\n      '24H': gen(96, R, 0.0031, 0.0011, 11),\n      '7D': gen(168, R, 0.026, 0.0022, 22),\n      '30D': gen(180, R, 0.081, 0.0048, 33),\n      '90D': gen(180, R, 0.148, 0.007, 44)\n    };\n    this.tid = 0;\n    this.state = {\n      route: 'home', theme: 'dark', vw: 1280,\n      wallet: 'disconnected', connectOpen: false, connecting: '', addrMenu: false,\n      dataState: 'live',\n      side: 'buy', amount: '', ack: false,\n      sheet: false, phase: 'review', liveSig: '', receipt: null,\n      period: '7D', hoverIdx: null,\n      typeFilter: 'all', statusFilter: 'all', visibleTx: 6,\n      tipKey: '', faqOpen: {}, tocActive: 'learn-what',\n      refreshing: false,\n      rate: R, updated: new Date(),\n      usdcBal: 2140.55, bnkrBal: 12450.32, escrowBnkr: 300, pendingUsdc: 325.29,\n      toasts: [],\n      txs: [\n        { id: 1, type: 'Buy', amt: 461.13, ccy: 'BNKR', pay: '500.00 USDC paid', value: '$500.00', status: 'Confirmed', date: 'Jul 7, 14:21', sig: '5GqQz…f9dF' },\n        { id: 2, type: 'Sell', amt: 300, ccy: 'BNKR', pay: 'STL-1042 · in escrow', value: '≈ $325.29', status: 'Pending settlement', date: 'Jul 7, 11:05', sig: '3xVbn…q7Lm', cancellable: true },\n        { id: 3, type: 'Sell', amt: 850, ccy: 'BNKR', pay: 'STL-1031 · 402.11 of 921.66 settled', value: '$921.66', status: 'Partially settled', date: 'Jul 6, 18:40', sig: '7JdHs…a4Qe', cancellable: true },\n        { id: 4, type: 'Buy', amt: 92.2, ccy: 'BNKR', pay: '100.00 USDC paid', value: '$100.00', status: 'Submitted', date: 'Jul 7, 14:29', sig: '9KpRw…t2Ny' },\n        { id: 5, type: 'Sell', amt: 1500, ccy: 'BNKR', pay: 'STL-0996 · settled in full', value: '$1,626.45', status: 'Settled', date: 'Jul 6, 09:12', sig: '8TnLp…e5Gu' },\n        { id: 6, type: 'Buy', amt: 922.25, ccy: 'BNKR', pay: '1,000.00 USDC paid', value: '$1,000.00', status: 'Confirmed', date: 'Jul 5, 16:03', sig: '2WmCx…k8Rv' },\n        { id: 7, type: 'Sell', amt: 800, ccy: 'BNKR', pay: 'STL-0982 · returned to wallet', value: '—', status: 'Cancelled', date: 'Jul 5, 10:44', sig: '4QzMf…j3Wd' },\n        { id: 8, type: 'Buy', amt: 250, ccy: 'USDC', pay: 'Insufficient SOL for network fee', value: '—', status: 'Failed', date: 'Jul 4, 20:18', sig: '6RvKt…h9Bs', retryable: true },\n        { id: 9, type: 'Buy', amt: 1844.51, ccy: 'BNKR', pay: '2,000.00 USDC paid', value: '$2,000.00', status: 'Confirmed', date: 'Jul 4, 08:57', sig: 'Bq2Ws…m6Ke' },\n        { id: 10, type: 'Sell', amt: 420, ccy: 'BNKR', pay: 'STL-0961 · settled in full', value: '$451.02', status: 'Settled', date: 'Jul 3, 13:26', sig: 'Hx8Rp…c2Vd' }\n      ]\n    };\n  }\n\n  componentDidMount() {\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem('bnkr-platform') || '{}'); } catch (e) {}\n    const theme = saved.theme || 'dark';\n    const patch = { theme, vw: window.innerWidth };\n    if (this.props.startRoute) patch.route = this.props.startRoute;\n    else if (saved.route) patch.route = saved.route;\n    const wProp = this.props.walletState;\n    if (wProp && wProp !== 'auto') patch.wallet = wProp;\n    else if (saved.wallet === 'connected') patch.wallet = 'connected';\n    const dProp = this.props.dataState;\n    if (dProp && dProp !== 'live') patch.dataState = dProp;\n    this.setState(patch);\n    document.body.dataset.theme = theme;\n    this.onResize = () => this.setState({ vw: window.innerWidth });\n    window.addEventListener('resize', this.onResize);\n    this.tick = setInterval(() => {\n      if (document.hidden) return;\n      if (this.state.dataState !== 'live') return;\n      const drift = (Math.random() - 0.485) * 0.0007;\n      const r = Math.max(0.9, this.state.rate + drift);\n      Object.keys(this.series).forEach(k => { const a = this.series[k]; a[a.length - 1] = r; });\n      this.setState({ rate: r, updated: new Date() });\n    }, 5000);\n  }\n\n  componentWillUnmount() {\n    if (this.tick) clearInterval(this.tick);\n    if (this.onResize) window.removeEventListener('resize', this.onResize);\n  }\n\n  componentDidUpdate(prevProps) {\n    if (prevProps.walletState !== this.props.walletState) {\n      const w = this.props.walletState;\n      this.setState({ wallet: (!w || w === 'auto') ? 'disconnected' : w });\n    }\n    if (prevProps.dataState !== this.props.dataState) {\n      this.setState({ dataState: this.props.dataState || 'live' });\n    }\n  }\n\n  persist(patch) {\n    try {\n      const cur = JSON.parse(localStorage.getItem('bnkr-platform') || '{}');\n      localStorage.setItem('bnkr-platform', JSON.stringify(Object.assign(cur, patch)));\n    } catch (e) {}\n  }\n\n  fmt(n, d) { if (d === undefined) d = 2; return Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }\n\n  toast(msg, tone) {\n    const id = ++this.tid;\n    this.setState(s => ({ toasts: s.toasts.concat([{ id, msg, tone: tone || 'ok' }]) }));\n    setTimeout(() => this.setState(s => ({ toasts: s.toasts.filter(t => t.id !== id) })), 4000);\n  }\n\n  copyText(t) { try { navigator.clipboard.writeText(t); } catch (e) {} }\n\n  go(r) {\n    this.setState({ route: r, addrMenu: false, hoverIdx: null });\n    this.persist({ route: r });\n    setTimeout(() => window.scrollTo(0, 0), 20);\n  }\n\n  fakeSig() {\n    const c = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';\n    let a = '', b = '';\n    for (let i = 0; i < 5; i++) a += c[Math.floor(Math.random() * c.length)];\n    for (let i = 0; i < 4; i++) b += c[Math.floor(Math.random() * c.length)];\n    return a + '…' + b;\n  }\n\n  nowLabel() {\n    const d = new Date();\n    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });\n  }\n\n  pick(name) {\n    if (this.state.connecting) return;\n    this.setState({ connecting: name, wallet: 'connecting' });\n    setTimeout(() => {\n      this.setState({ wallet: 'connected', connecting: '', connectOpen: false });\n      this.persist({ wallet: 'connected' });\n      this.toast('Wallet connected — Hmod…4JhK');\n    }, 1100);\n  }\n\n  geom(pts, W, H, padTop, padBot) {\n    const min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);\n    const span = (max - min) || 0.001;\n    const lo = min - span * 0.08, hi = max + span * 0.08;\n    const ih = H - padTop - padBot;\n    const xy = pts.map((v, i) => [(i / (pts.length - 1)) * W, padTop + ih - ((v - lo) / (hi - lo)) * ih]);\n    let d = 'M' + xy[0 nce rate. BNKR is minted directly to your wallet.'\n        : 'Selling files a settlement request. Your BNKR is escrowed and USDC is paid from pool liquidity — cancellable while unsettled.',\n      payLabel: isBuy ? 'You pay' : 'You sell',\n      recvLabel: 'You receive (estimated)',\n      payToken: isBuy ? 'USDC' : 'BNKR', recvToken: isBuy ? 'BNKR' : 'USDC',\n      payDot: isBuy ? 'var(--blue)' : 'var(--accent)',\n      recvDot: isBuy ? 'var(--accent)' : 'var(--blue)',\n      payBal: connected ? this.fmt(bal) : '—',\n      recvBal: connected ? this.fmt(isBuy ? s.bnkrBal : s.usdcBal) : '—',\n      amount: s.amount,\n      onAmount: (e) => {\n        let v = e.target.value.replace(/[^0-9.]/g, '');\n        const i = v.indexOf('.');\n        if (i !== -1) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\\./g, '');\n        this.setState({ amount: v });\n      },\n      setMax: () => { if (connected) this.setState({ amount: bal.toFixed(2) }); },\n      amountError: insufficient,\n      amountErrorMsg: 'Amount exceeds your ' + (isBuy ? 'USDC' : 'BNKR') + ' balance of ' + this.fmt(bal) + '.',\n      estFmt: amt > 0 ? this.fmt(est) : '0.00',\n      estColor: amt > 0 ? 'var(--text)' : 'var(--text-3)',\n      expectLabel: expectImmediate ? 'Immediate' : 'Queued — partial fill likely',\n      expectColor: expectImmediate ? 'var(--accent)' : 'var(--amber)',\n      expectSheetNote: expectImmediate\n        ? 'At current liquidity this request is expected to settle immediately.'\n        : 'This request exceeds liquid USDC and will queue until liquidity is replenished.',\n      ack: s.ack,\n      toggleAck: () => this.setState({ ack: !s.ack }),\n      ackAria: s.ack ? 'true' : 'false',\n      ackBg: s.ack ? 'var(--accent-btn)' : 'transparent',\n      ackBorder: s.ack ? 'var(--accent-btn)' : 'var(--border-2)',\n      ackCheckOp: s.ack ? 1 : 0,\n      ctaLabel, ctaDisabled,\n      ctaBg: cs[0], ctaColor: cs[1], ctaBorder: cs[2],\n      ctaCursor: ctaDisabled ? 'not-allowed' : 'p
